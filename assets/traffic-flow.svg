<svg viewBox="0 0 860 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif">
  <!-- ===== 노드 ===== -->
  <!-- 사용자 -->
  <rect x="14" y="112" width="118" height="56" rx="10" fill="none" stroke="#7d8590" stroke-width="1.5"/>
  <text x="73" y="136" text-anchor="middle" fill="#2f81f7" font-size="13" font-weight="700">사용자</text>
  <text x="73" y="154" text-anchor="middle" fill="#7d8590" font-size="11">동시접속 30,000</text>

  <!-- CloudFront -->
  <rect x="192" y="112" width="128" height="56" rx="10" fill="none" stroke="#7d8590" stroke-width="1.5"/>
  <text x="256" y="136" text-anchor="middle" fill="#2f81f7" font-size="13" font-weight="700">CloudFront CDN</text>
  <text x="256" y="154" text-anchor="middle" fill="#7d8590" font-size="11">이미지·정적 엣지 종결</text>

  <!-- ALB -->
  <rect x="380" y="112" width="64" height="56" rx="10" fill="none" stroke="#7d8590" stroke-width="1.5"/>
  <text x="412" y="145" text-anchor="middle" fill="#2f81f7" font-size="13" font-weight="700">ALB</text>

  <!-- Next.js x3 (×6 표기) -->
  <g id="nextboxes">
    <rect id="nx1" x="506" y="58"  width="106" height="42" rx="9" fill="none" stroke="#7d8590" stroke-width="1.5">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect id="nx2" x="506" y="119" width="106" height="42" rx="9" fill="none" stroke="#7d8590" stroke-width="1.5">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect id="nx3" x="506" y="180" width="106" height="42" rx="9" fill="none" stroke="#7d8590" stroke-width="1.5">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="559" y="84"  text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
    <text x="559" y="145" text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
    <text x="559" y="206" text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
    <text x="627" y="145" fill="#7d8590" font-size="12" font-weight="700">×6</text>
  </g>

  <!-- Redis (실린더) -->
  <g>
    <path d="M700,96 a44,12 0 0,0 88,0 v70 a44,12 0 0,1 -88,0 z" fill="none" stroke="#a371f7" stroke-width="1.6"/>
    <ellipse cx="744" cy="96" rx="44" ry="12" fill="none" stroke="#a371f7" stroke-width="1.6"/>
    <text x="744" y="134" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="700">Redis</text>
    <text x="744" y="150" text-anchor="middle" fill="#7d8590" font-size="10">공유 CacheHandler</text>
    <!-- 무효화 파문 -->
    <circle cx="744" cy="130" r="8" fill="none" stroke="#f78166" stroke-width="2" opacity="0">
      <animate attributeName="r"       values="8;8;8;46;8"   keyTimes="0;0;0.78;0.90;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0;0"  keyTimes="0;0;0.78;0.90;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="744" y="196" text-anchor="middle" fill="#f78166" font-size="11" font-weight="700" opacity="0">
      전파 6.4ms
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.82;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 백엔드 (점선, 미스만) -->
  <rect x="700" y="238" width="110" height="44" rx="9" fill="none" stroke="#7d8590" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="755" y="257" text-anchor="middle" fill="#7d8590" font-size="12">백엔드 API</text>
  <text x="755" y="273" text-anchor="middle" fill="#7d8590" font-size="10">캐시 미스만</text>

  <!-- 어드민 웹훅 -->
  <rect x="192" y="16" width="128" height="40" rx="9" fill="none" stroke="#f78166" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="256" y="41" text-anchor="middle" fill="#f78166" font-size="12" font-weight="700">어드민 Webhook</text>

  <!-- ===== 연결선 ===== -->
  <g stroke="#7d8590" stroke-width="1.2" opacity="0.55">
    <line x1="132" y1="140" x2="192" y2="140"/>
    <line x1="320" y1="140" x2="380" y2="140"/>
    <line x1="444" y1="140" x2="506" y2="79"/>
    <line x1="444" y1="140" x2="506" y2="140"/>
    <line x1="444" y1="140" x2="506" y2="201"/>
    <line x1="612" y1="79"  x2="704" y2="112"/>
    <line x1="612" y1="140" x2="700" y2="135"/>
    <line x1="612" y1="201" x2="704" y2="160"/>
    <line x1="612" y1="210" x2="700" y2="252" stroke-dasharray="5 4"/>
  </g>
  <path d="M320,36 L412,36 L412,112" fill="none" stroke="#f78166" stroke-width="1.2" opacity="0.5" stroke-dasharray="5 4"/>

  <!-- ===== 트래픽 점 (사용자→CDN, 다수가 엣지에서 종결) ===== -->
  <g fill="#2f81f7">
    <circle r="4"><animateMotion path="M132,140 L192,140" dur="2.4s" begin="0s"    repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M132,138 L192,138" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M132,143 L192,143" dur="2.4s" begin="-1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="2.4s" begin="-1.0s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M132,136 L192,136" dur="2.4s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="2.4s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M132,145 L192,145" dur="2.4s" begin="-2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="2.4s" begin="-2.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 일부만 CDN 통과 → ALB → Next (3갈래) -->
  <g fill="#2f81f7">
    <circle r="4"><animateMotion path="M320,140 L380,140 M444,140 L506,79"  dur="4.8s" begin="0s"    repeatCount="indefinite" calcMode="linear" keyPoints="0;0.45;0.55;1" keyTimes="0;0.4;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.38;0.42;0.5;0.92;1" dur="4.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M320,140 L380,140 M444,140 L506,140" dur="4.8s" begin="-1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.45;0.55;1" keyTimes="0;0.4;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.38;0.42;0.5;0.92;1" dur="4.8s" begin="-1.6s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M320,140 L380,140 M444,140 L506,201" dur="4.8s" begin="-3.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.45;0.55;1" keyTimes="0;0.4;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.38;0.42;0.5;0.92;1" dur="4.8s" begin="-3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Next ↔ Redis 캐시 조회 점 -->
  <g fill="#a371f7">
    <circle r="3"><animateMotion path="M612,140 L700,135 L612,140" dur="3.2s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M612,79 L704,112 L612,79"   dur="3.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M612,201 L704,160 L612,201" dur="3.2s" begin="-2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 웹훅 점: 8초 주기 — 어드민→ALB→Next#2→Redis -->
  <circle r="4.5" fill="#f78166" opacity="0">
    <animateMotion path="M320,36 L412,36 L412,140 L506,140 M612,140 L700,135" dur="8s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;0.62;0.62;1;1" keyTimes="0;0.55;0.72;0.74;0.80;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.78;0.81;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
