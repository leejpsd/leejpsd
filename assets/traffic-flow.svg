<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif">
  <!-- ===================== 노드 ===================== -->
  <!-- 사용자 -->
  <rect x="14" y="150" width="118" height="60" rx="10" fill="none" stroke="#7d8590" stroke-width="1.5"/>
  <text x="73" y="176" text-anchor="middle" fill="#2f81f7" font-size="13" font-weight="700">사용자</text>
  <text x="73" y="194" text-anchor="middle" fill="#7d8590" font-size="11">동시접속 30,000</text>

  <!-- CloudFront (이미지·정적 전용) -->
  <rect x="190" y="34" width="132" height="58" rx="10" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="256" y="58" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">CloudFront CDN</text>
  <text x="256" y="76" text-anchor="middle" fill="#7d8590" font-size="10.5">이미지·정적 — 엣지 히트 시 종결</text>

  <!-- S3 -->
  <rect x="392" y="36" width="84" height="54" rx="10" fill="none" stroke="#3fb950" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="434" y="59" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">S3</text>
  <text x="434" y="76" text-anchor="middle" fill="#7d8590" font-size="10">이미지 원본</text>

  <!-- ALB -->
  <rect x="250" y="152" width="64" height="56" rx="10" fill="none" stroke="#7d8590" stroke-width="1.5"/>
  <text x="282" y="185" text-anchor="middle" fill="#2f81f7" font-size="13" font-weight="700">ALB</text>

  <!-- Next.js ×6 (3박스로 표현) -->
  <g>
    <rect x="400" y="92"  width="106" height="42" rx="9" fill="none" stroke="#7d8590" stroke-width="1.5">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="162" width="106" height="42" rx="9" fill="none" stroke="#7d8590" stroke-width="1.5">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="232" width="106" height="42" rx="9" fill="none" stroke="#7d8590" stroke-width="1.5">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="453" y="118" text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
    <text x="453" y="188" text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
    <text x="453" y="258" text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
    <text x="520" y="188" fill="#7d8590" font-size="12" font-weight="700">×6</text>
  </g>

  <!-- Redis -->
  <g>
    <path d="M611,118 a44,12 0 0,0 88,0 v72 a44,12 0 0,1 -88,0 z" fill="none" stroke="#a371f7" stroke-width="1.6"/>
    <ellipse cx="655" cy="118" rx="44" ry="12" fill="none" stroke="#a371f7" stroke-width="1.6"/>
    <text x="655" y="152" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="700">Redis</text>
    <text x="655" y="168" text-anchor="middle" fill="#7d8590" font-size="9.5">공유 CacheHandler</text>
    <text x="655" y="181" text-anchor="middle" fill="#7d8590" font-size="9.5">FETCH 데이터 + PAGE HTML</text>
    <!-- 무효화 파문 -->
    <circle cx="655" cy="150" r="8" fill="none" stroke="#f78166" stroke-width="2" opacity="0">
      <animate attributeName="r"       values="8;8;8;48;8"  keyTimes="0;0;0.80;0.92;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0;0.80;0.92;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="655" y="218" text-anchor="middle" fill="#f78166" font-size="11" font-weight="700" opacity="0">
      전역 무효화 — 6대 동시 반영
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.84;0.94;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 백엔드 -->
  <rect x="610" y="285" width="110" height="44" rx="9" fill="none" stroke="#7d8590" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="665" y="304" text-anchor="middle" fill="#7d8590" font-size="12">백엔드 API</text>
  <text x="665" y="320" text-anchor="middle" fill="#7d8590" font-size="10">캐시 미스만</text>

  <!-- 백엔드 Webhook (어드민 수정 시) -->
  <rect x="20" y="20" width="150" height="44" rx="9" fill="none" stroke="#f78166" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="95" y="39" text-anchor="middle" fill="#f78166" font-size="12" font-weight="700">백엔드 Webhook</text>
  <text x="95" y="55" text-anchor="middle" fill="#7d8590" font-size="10">어드민 수정 시</text>

  <!-- ===================== 연결선 ===================== -->
  <g stroke="#7d8590" stroke-width="1.2" opacity="0.5">
    <!-- HTML: 사용자 → ALB -->
    <line x1="132" y1="180" x2="250" y2="180"/>
    <!-- ALB → Next 3갈래 -->
    <line x1="314" y1="180" x2="400" y2="113"/>
    <line x1="314" y1="180" x2="400" y2="183"/>
    <line x1="314" y1="180" x2="400" y2="253"/>
    <!-- Next ↔ Redis -->
    <line x1="506" y1="113" x2="613" y2="135"/>
    <line x1="506" y1="183" x2="611" y2="153"/>
    <line x1="506" y1="253" x2="613" y2="172"/>
    <!-- Next → 백엔드 (미스만) -->
    <line x1="506" y1="264" x2="610" y2="300" stroke-dasharray="5 4"/>
  </g>
  <!-- 이미지: 사용자 → CloudFront, CF → S3(미스만) -->
  <g stroke="#3fb950" stroke-width="1.2" opacity="0.5">
    <line x1="120" y1="150" x2="196" y2="90"/>
    <line x1="322" y1="63" x2="392" y2="63" stroke-dasharray="5 4"/>
  </g>
  <!-- 웹훅 경로 -->
  <path d="M170,42 L282,42 L282,152" fill="none" stroke="#f78166" stroke-width="1.2" opacity="0.5" stroke-dasharray="5 4"/>

  <!-- ===================== 애니메이션 점 ===================== -->
  <!-- 이미지 요청(초록): 대부분 엣지에서 종결 -->
  <g fill="#3fb950">
    <circle r="3.5"><animateMotion path="M120,150 L196,90" dur="2s" begin="0s"    repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion path="M124,155 L200,95" dur="2s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2s" begin="-0.7s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion path="M116,146 L192,86" dur="2s" begin="-1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <!-- 가끔 미스 → S3 -->
    <circle r="3.5" opacity="0">
      <animateMotion path="M322,63 L392,63" dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.62;0.78;1"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.76;0.79;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HTML 요청(파랑): 사용자 → ALB → Next 3갈래 -->
  <g fill="#2f81f7">
    <circle r="4"><animateMotion path="M132,180 L250,180 M314,180 L400,113" dur="4.5s" begin="0s"    repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M132,183 L250,183 M314,180 L400,183" dur="4.5s" begin="-1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M132,177 L250,177 M314,180 L400,253" dur="4.5s" begin="-3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-3.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 캐시 조회(보라): Next ↔ Redis 왕복 -->
  <g fill="#a371f7">
    <circle r="3"><animateMotion path="M506,113 L613,135 L506,113" dur="3.2s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M506,183 L611,153 L506,183" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M506,253 L613,172 L506,253" dur="3.2s" begin="-2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 캐시 미스(회색): Next → 백엔드 가끔 -->
  <circle r="3" fill="#7d8590" opacity="0">
    <animateMotion path="M506,264 L610,300" dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.75;1"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.55;0.57;0.73;0.76;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 웹훅(주황): 8초 주기 — Webhook → ALB → "한 대"(#2) → Redis -->
  <circle r="4.5" fill="#f78166" opacity="0">
    <animateMotion path="M170,42 L282,42 L282,152 M314,180 L400,183 M506,183 L611,153" dur="8s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;0.5;0.5;0.69;0.69;1;1" keyTimes="0;0.55;0.66;0.665;0.73;0.735;0.80;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.79;0.81;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- "한 대에만 도달" 라벨 -->
  <text x="357" y="205" text-anchor="middle" fill="#f78166" font-size="10.5" font-weight="700" opacity="0">
    LB 탓에 한 대에만 도달
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.78;0.81;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- ===================== 범례 ===================== -->
  <g font-size="10.5" fill="#7d8590">
    <circle cx="24"  cy="346" r="4" fill="#2f81f7"/><text x="34"  y="350">HTML·데이터 요청</text>
    <circle cx="150" cy="346" r="4" fill="#3fb950"/><text x="160" y="350">이미지·정적 (엣지 종결)</text>
    <circle cx="310" cy="346" r="4" fill="#a371f7"/><text x="320" y="350">캐시 조회</text>
    <circle cx="395" cy="346" r="4" fill="#f78166"/><text x="405" y="350">무효화 웹훅 (8초마다)</text>
    <circle cx="545" cy="346" r="4" fill="#7d8590"/><text x="555" y="350">캐시 미스 → 원본</text>
  </g>
</svg>
