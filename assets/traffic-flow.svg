<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif">
  <defs>
    <filter id="pglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pglow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- ===== 캔버스 ===== -->
  <rect x="3" y="3" width="894" height="394" rx="18" fill="#0B0F19" stroke="#F0F6FC" stroke-opacity="0.10"/>
  <ellipse cx="200" cy="200" rx="200" ry="130" fill="#58A6FF" opacity="0.06" filter="url(#soft)"/>
  <ellipse cx="680" cy="190" rx="160" ry="120" fill="#BC8CFF" opacity="0.07" filter="url(#soft)"/>
  <!-- 클라이맥스 캔버스 비트 -->
  <rect x="3" y="3" width="894" height="394" rx="18" fill="none" stroke="#F0883E" stroke-width="1.6" opacity="0">
    <animate attributeName="opacity" values="0;0;0.35;0;0" keyTimes="0;0.80;0.84;0.90;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== 타이틀 · 범례 ===== -->
  <text x="36" y="40" fill="#E6EDF3" font-size="13.5" font-weight="700" letter-spacing="1">발매 트래픽 플로우 <tspan fill="#8B949E" font-size="11" font-weight="600">· 8초 루프</tspan></text>
  <g font-size="10.5" font-weight="600" fill="#9DA7B3">
    <circle cx="540" cy="35" r="3.5" fill="#79C0FF"/><text x="550" y="39">HTML·데이터</text>
    <circle cx="640" cy="35" r="3.5" fill="#56D364"/><text x="650" y="39">이미지·정적</text>
    <circle cx="734" cy="35" r="3.5" fill="#D2A8FF"/><text x="744" y="39">캐시 조회</text>
    <circle cx="812" cy="35" r="3.5" fill="#FFA657"/><text x="822" y="39">무효화</text>
  </g>

  <!-- ===== 흐름선 (레인 색 미량 주입) ===== -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M140,162 Q190,118 240,88"  stroke="#56D364" stroke-opacity="0.20"/>
    <path d="M368,78 L430,78"           stroke="#56D364" stroke-opacity="0.16" stroke-dasharray="3 5"/>
    <path d="M168,190 L250,190"         stroke="#79C0FF" stroke-opacity="0.22"/>
    <path d="M322,190 Q362,190 404,152" stroke="#79C0FF" stroke-opacity="0.22"/>
    <path d="M322,190 L404,208"         stroke="#79C0FF" stroke-opacity="0.22"/>
    <path d="M322,190 Q362,236 404,264" stroke="#79C0FF" stroke-opacity="0.22"/>
    <path d="M548,152 Q586,162 620,174" stroke="#D2A8FF" stroke-opacity="0.20"/>
    <path d="M548,208 L620,192"         stroke="#D2A8FF" stroke-opacity="0.20"/>
    <path d="M548,264 Q586,240 620,210" stroke="#D2A8FF" stroke-opacity="0.20"/>
    <path d="M548,278 Q590,302 620,318" stroke="#8B949E" stroke-opacity="0.20" stroke-dasharray="3 5"/>
    <path d="M190,326 L266,326 Q286,326 286,306 L286,222" stroke="#FFA657" stroke-opacity="0.28" stroke-dasharray="3 5"/>
  </g>

  <!-- ===== 노드 ===== -->
  <!-- 사용자 -->
  <rect x="40" y="156" width="128" height="68" rx="13" fill="#F0F6FC" fill-opacity="0.05" stroke="#F0F6FC" stroke-opacity="0.22" stroke-width="1.3"/>
  <text x="104" y="185" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="700">사용자</text>
  <text x="104" y="204" text-anchor="middle" fill="#9DA7B3" font-size="11">동시접속 30,000</text>

  <!-- CloudFront -->
  <rect x="240" y="50" width="128" height="60" rx="13" fill="#F0F6FC" fill-opacity="0.05" stroke="#F0F6FC" stroke-opacity="0.22" stroke-width="1.3"/>
  <text x="304" y="75" text-anchor="middle" fill="#E6EDF3" font-size="13.5" font-weight="700">CloudFront</text>
  <text x="304" y="93" text-anchor="middle" fill="#9DA7B3" font-size="10.5">이미지·정적 엣지 종결</text>

  <!-- S3 -->
  <rect x="430" y="54" width="88" height="52" rx="12" fill="none" stroke="#F0F6FC" stroke-opacity="0.16" stroke-width="1.1" stroke-dasharray="3 4"/>
  <text x="474" y="76" text-anchor="middle" fill="#C9D1D9" font-size="12" font-weight="700">S3</text>
  <text x="474" y="93" text-anchor="middle" fill="#8B949E" font-size="10">이미지 원본 · 미스만</text>

  <!-- ALB -->
  <rect x="250" y="156" width="72" height="68" rx="13" fill="#F0F6FC" fill-opacity="0.05" stroke="#F0F6FC" stroke-opacity="0.22" stroke-width="1.3"/>
  <text x="286" y="195" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="700">ALB</text>
  <!-- 웹훅 도착 펄스 -->
  <circle cx="286" cy="190" r="10" fill="none" stroke="#FFA657" stroke-width="1.8" opacity="0">
    <animate attributeName="r"       values="10;10;10;26;10" keyTimes="0;0.65;0.655;0.72;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.8;0;0"    keyTimes="0;0.65;0.655;0.72;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Next.js 클러스터 -->
  <rect x="392" y="104" width="168" height="196" rx="15" fill="#F0F6FC" fill-opacity="0.03" stroke="#F0F6FC" stroke-opacity="0.20" stroke-width="1.3"/>
  <text x="408" y="128" fill="#E6EDF3" font-size="12.5" font-weight="700">Next.js</text>
  <text x="544" y="128" text-anchor="end" fill="#8B949E" font-size="10">렌더링 서버</text>
  <g>
    <rect x="404" y="138" width="144" height="34" rx="9" fill="#F0F6FC" fill-opacity="0.04" stroke="#F0F6FC" stroke-opacity="0.20" stroke-width="1.1">
      <animate attributeName="stroke"         values="#F0F6FC;#F0F6FC;#FFA657;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.20;0.20;1;0.20"                keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill"           values="#F0F6FC;#F0F6FC;#FFA657;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"   values="0.04;0.04;0.14;0.04"             keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="404" y="194" width="144" height="34" rx="9" fill="#F0F6FC" fill-opacity="0.04" stroke="#F0F6FC" stroke-opacity="0.20" stroke-width="1.1">
      <animate attributeName="stroke"         values="#F0F6FC;#F0F6FC;#FFA657;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.20;0.20;1;0.20"                keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill"           values="#F0F6FC;#F0F6FC;#FFA657;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"   values="0.04;0.04;0.14;0.04"             keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="404" y="250" width="144" height="34" rx="9" fill="#F0F6FC" fill-opacity="0.04" stroke="#F0F6FC" stroke-opacity="0.20" stroke-width="1.1">
      <animate attributeName="stroke"         values="#F0F6FC;#F0F6FC;#FFA657;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.20;0.20;1;0.20"                keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill"           values="#F0F6FC;#F0F6FC;#FFA657;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"   values="0.04;0.04;0.14;0.04"             keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="476" y="160" text-anchor="middle" fill="#C9D1D9" font-size="11" font-weight="600">instance</text>
    <text x="476" y="216" text-anchor="middle" fill="#C9D1D9" font-size="11" font-weight="600">instance</text>
    <text x="476" y="272" text-anchor="middle" fill="#C9D1D9" font-size="11" font-weight="600">instance</text>
    <circle cx="532" cy="156" r="2.4" fill="#56D364"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="532" cy="212" r="2.4" fill="#56D364"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" begin="-0.7s" repeatCount="indefinite"/></circle>
    <circle cx="532" cy="268" r="2.4" fill="#56D364"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" begin="-1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Redis -->
  <rect x="620" y="150" width="100" height="84" rx="15" fill="#BC8CFF" fill-opacity="0.07" stroke="#BC8CFF" stroke-opacity="0.62" stroke-width="1.4"/>
  <ellipse cx="670" cy="171" rx="16" ry="5" fill="none" stroke="#D2A8FF" stroke-opacity="0.9" stroke-width="1.3"/>
  <path d="M654,171 v10 a16,5 0 0,0 32,0 v-10" fill="none" stroke="#D2A8FF" stroke-opacity="0.9" stroke-width="1.3"/>
  <text x="670" y="208" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">Redis</text>
  <text x="670" y="224" text-anchor="middle" fill="#9DA7B3" font-size="10">FETCH·PAGE 캐시 공유</text>
  <!-- 3중 파문 -->
  <circle cx="670" cy="192" r="10" fill="none" stroke="#FFA657" stroke-width="2.4" opacity="0" filter="url(#pglow2)">
    <animate attributeName="r"       values="10;10;10;60;10" keyTimes="0;0.79;0.80;0.92;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0;0"      keyTimes="0;0.79;0.80;0.92;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="670" cy="192" r="10" fill="none" stroke="#FFA657" stroke-width="1.4" opacity="0">
    <animate attributeName="r"       values="10;10;10;82;10" keyTimes="0;0.81;0.82;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.55;0;0"   keyTimes="0;0.81;0.82;0.95;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="670" cy="192" r="10" fill="none" stroke="#FFA657" stroke-width="0.8" opacity="0">
    <animate attributeName="r"       values="10;10;10;102;10" keyTimes="0;0.83;0.84;0.97;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.3;0;0"     keyTimes="0;0.83;0.84;0.97;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 백엔드 -->
  <rect x="620" y="304" width="100" height="50" rx="12" fill="none" stroke="#F0F6FC" stroke-opacity="0.16" stroke-width="1.1" stroke-dasharray="3 4"/>
  <text x="670" y="326" text-anchor="middle" fill="#C9D1D9" font-size="11.5" font-weight="600">백엔드 API</text>
  <text x="670" y="342" text-anchor="middle" fill="#8B949E" font-size="10">캐시 미스만</text>

  <!-- 웹훅 -->
  <rect x="40" y="302" width="150" height="52" rx="12" fill="#F0883E" fill-opacity="0.07" stroke="#FFA657" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="115" y="324" text-anchor="middle" fill="#FFA657" font-size="12" font-weight="700">백엔드 Webhook</text>
  <text x="115" y="341" text-anchor="middle" fill="#9DA7B3" font-size="10">어드민 수정 시</text>

  <!-- ===== 입자 ===== -->
  <!-- 이미지(초록) -->
  <g fill="#56D364" filter="url(#pglow)">
    <circle r="3.6"><animateMotion path="M140,162 Q190,118 240,88" dur="2.2s" begin="0s"     repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M140,166 Q192,124 242,92" dur="2.2s" begin="-0.73s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2.2s" begin="-0.73s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M140,158 Q188,112 238,84" dur="2.2s" begin="-1.46s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2.2s" begin="-1.46s" repeatCount="indefinite"/></circle>
    <circle r="3.6" opacity="0">
      <animateMotion path="M368,78 L430,78" dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.62;0.78;1"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.76;0.79;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HTML(파랑) + 꼬리 -->
  <g fill="#79C0FF" filter="url(#pglow)">
    <circle r="4"><animateMotion path="M168,190 L250,190 M322,190 Q362,190 404,152" dur="4.5s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="2.4" opacity="0.5"><animateMotion path="M168,190 L250,190 M322,190 Q362,190 404,152" dur="4.5s" begin="0.14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="0.5;0.5;0;0.5;0.5;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="0.14s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M168,193 L250,193 M322,190 L404,208" dur="4.5s" begin="-1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle r="2.4" opacity="0.5"><animateMotion path="M168,193 L250,193 M322,190 L404,208" dur="4.5s" begin="-1.36s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="0.5;0.5;0;0.5;0.5;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-1.36s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M168,187 L250,187 M322,190 Q362,236 404,264" dur="4.5s" begin="-3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-3.0s" repeatCount="indefinite"/></circle>
    <circle r="2.4" opacity="0.5"><animateMotion path="M168,187 L250,187 M322,190 Q362,236 404,264" dur="4.5s" begin="-2.86s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="0.5;0.5;0;0.5;0.5;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-2.86s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 캐시 조회(보라) -->
  <g fill="#D2A8FF" filter="url(#pglow)">
    <circle r="3"><animateMotion path="M548,152 Q586,162 620,174 Q586,162 548,152" dur="3.2s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M548,208 L620,192 L548,208"                 dur="3.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M548,264 Q586,240 620,210 Q586,240 548,264" dur="3.2s" begin="-2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 캐시 미스(회색) -->
  <circle r="3" fill="#9DA7B3" opacity="0" filter="url(#pglow)">
    <animateMotion path="M548,278 Q590,302 620,318" dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.75;1"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.55;0.57;0.73;0.76;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 웹훅(주황) -->
  <circle r="5" fill="#FFA657" opacity="0" filter="url(#pglow2)">
    <animateMotion path="M190,326 L266,326 Q286,326 286,306 L286,222 M322,190 L404,208 M548,208 L620,192" dur="8s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;0.55;0.55;0.79;0.79;1;1" keyTimes="0;0.55;0.66;0.665;0.73;0.735;0.80;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.79;0.81;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== 이벤트 필 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.78;0.81;1" dur="8s" repeatCount="indefinite"/>
    <rect x="288" y="238" width="148" height="26" rx="13" fill="#0B0F19" stroke="#FFA657" stroke-opacity="0.8" stroke-width="1.1"/>
    <text x="362" y="255.5" text-anchor="middle" fill="#FFA657" font-size="11" font-weight="700">LB 탓에 한 대에만 도달</text>
  </g>
  <g opacity="0" filter="url(#pglow)">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.84;0.94;1" dur="8s" repeatCount="indefinite"/>
    <rect x="578" y="248" width="184" height="30" rx="15" fill="#F0883E"/>
    <text x="670" y="268" text-anchor="middle" fill="#0B0F19" font-size="12" font-weight="800">전역 무효화 · 6대 동시 반영</text>
  </g>
</svg>
