<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590" opacity="0.5"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950" opacity="0.55"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f78166" opacity="0.6"/></marker>
  </defs>

  <!-- ===================== 연결선 (노드 뒤) ===================== -->
  <g stroke="#7d8590" stroke-width="1.2" opacity="0.42" stroke-linecap="round">
    <line x1="132" y1="180" x2="246" y2="180" marker-end="url(#ar)"/>
    <line x1="314" y1="180" x2="396" y2="115" marker-end="url(#ar)"/>
    <line x1="314" y1="180" x2="396" y2="183" marker-end="url(#ar)"/>
    <line x1="314" y1="180" x2="396" y2="251" marker-end="url(#ar)"/>
    <line x1="506" y1="113" x2="613" y2="135"/>
    <line x1="506" y1="183" x2="611" y2="153"/>
    <line x1="506" y1="253" x2="613" y2="172"/>
    <line x1="506" y1="264" x2="606" y2="298" stroke-dasharray="4 3.5" marker-end="url(#ar)"/>
  </g>
  <g stroke="#3fb950" stroke-width="1.2" opacity="0.45" stroke-linecap="round">
    <line x1="120" y1="150" x2="194" y2="92" marker-end="url(#arg)"/>
    <line x1="322" y1="63" x2="388" y2="63" stroke-dasharray="4 3.5" marker-end="url(#arg)"/>
  </g>
  <path d="M170,290 L282,290 L282,212" fill="none" stroke="#f78166" stroke-width="1.2" opacity="0.45" stroke-dasharray="4 3.5" stroke-linecap="round" marker-end="url(#aro)"/>

  <!-- ===================== 노드 ===================== -->
  <!-- 사용자 -->
  <rect x="14" y="150" width="118" height="60" rx="12" fill="#2f81f7" fill-opacity="0.06" stroke="#7d8590" stroke-width="1.4"/>
  <text x="73" y="176" text-anchor="middle" fill="#2f81f7" font-size="13" font-weight="700">사용자</text>
  <text x="73" y="194" text-anchor="middle" fill="#6e7681" font-size="11">동시접속 30,000</text>

  <!-- CloudFront -->
  <rect x="190" y="34" width="132" height="58" rx="12" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-width="1.4"/>
  <text x="256" y="58" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">CloudFront CDN</text>
  <text x="256" y="76" text-anchor="middle" fill="#6e7681" font-size="10.5">이미지·정적 — 엣지 히트 시 종결</text>

  <!-- S3 -->
  <rect x="392" y="36" width="84" height="54" rx="12" fill="#3fb950" fill-opacity="0.04" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="434" y="59" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">S3</text>
  <text x="434" y="76" text-anchor="middle" fill="#6e7681" font-size="10">이미지 원본</text>

  <!-- ALB -->
  <rect x="250" y="152" width="64" height="56" rx="12" fill="#2f81f7" fill-opacity="0.06" stroke="#7d8590" stroke-width="1.4"/>
  <text x="282" y="185" text-anchor="middle" fill="#2f81f7" font-size="13" font-weight="700">ALB</text>

  <!-- Next.js (겹침 그림자 = 6대 암시) -->
  <g>
    <rect x="408" y="100" width="106" height="42" rx="10" fill="none" stroke="#7d8590" stroke-width="1.2" opacity="0.16"/>
    <rect x="408" y="170" width="106" height="42" rx="10" fill="none" stroke="#7d8590" stroke-width="1.2" opacity="0.16"/>
    <rect x="408" y="240" width="106" height="42" rx="10" fill="none" stroke="#7d8590" stroke-width="1.2" opacity="0.16"/>
    <rect x="400" y="92"  width="106" height="42" rx="10" fill="#2f81f7" fill-opacity="0.06" stroke="#7d8590" stroke-width="1.4">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="162" width="106" height="42" rx="10" fill="#2f81f7" fill-opacity="0.06" stroke="#7d8590" stroke-width="1.4">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="232" width="106" height="42" rx="10" fill="#2f81f7" fill-opacity="0.06" stroke="#7d8590" stroke-width="1.4">
      <animate attributeName="stroke" values="#7d8590;#7d8590;#f78166;#7d8590" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="453" y="118" text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
    <text x="453" y="188" text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
    <text x="453" y="258" text-anchor="middle" fill="#2f81f7" font-size="12" font-weight="700">Next.js</text>
  </g>

  <!-- Redis -->
  <g>
    <path d="M611,118 a44,12 0 0,0 88,0 v72 a44,12 0 0,1 -88,0 z" fill="#a371f7" fill-opacity="0.06" stroke="#a371f7" stroke-width="1.5"/>
    <ellipse cx="655" cy="118" rx="44" ry="12" fill="#a371f7" fill-opacity="0.08" stroke="#a371f7" stroke-width="1.5"/>
    <text x="655" y="152" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="700">Redis</text>
    <text x="655" y="168" text-anchor="middle" fill="#6e7681" font-size="9.5">공유 CacheHandler</text>
    <text x="655" y="181" text-anchor="middle" fill="#6e7681" font-size="9.5">FETCH·PAGE 공유</text>
    <!-- 무효화 파문 (이중 링) -->
    <circle cx="655" cy="150" r="8" fill="none" stroke="#f78166" stroke-width="2" opacity="0" filter="url(#glow2)">
      <animate attributeName="r"       values="8;8;8;48;8"  keyTimes="0;0;0.80;0.92;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0;0.80;0.92;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="655" cy="150" r="8" fill="none" stroke="#f78166" stroke-width="1.3" opacity="0">
      <animate attributeName="r"       values="8;8;8;62;8"  keyTimes="0;0;0.82;0.95;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0;0.82;0.95;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="655" y="224" text-anchor="middle" fill="#f78166" font-size="11" font-weight="700" opacity="0">
      전역 무효화 — 6대 동시 반영
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.84;0.94;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 백엔드 -->
  <rect x="610" y="285" width="110" height="44" rx="10" fill="#7d8590" fill-opacity="0.04" stroke="#7d8590" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="665" y="304" text-anchor="middle" fill="#7d8590" font-size="12">백엔드 API</text>
  <text x="665" y="320" text-anchor="middle" fill="#6e7681" font-size="10">캐시 미스만</text>

  <!-- 백엔드 Webhook -->
  <rect x="20" y="268" width="150" height="44" rx="10" fill="#f78166" fill-opacity="0.05" stroke="#f78166" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="95" y="287" text-anchor="middle" fill="#f78166" font-size="12" font-weight="700">백엔드 Webhook</text>
  <text x="95" y="303" text-anchor="middle" fill="#6e7681" font-size="10">어드민 수정 시</text>

  <!-- ===================== 애니메이션 점 ===================== -->
  <!-- 이미지(초록) -->
  <g fill="#3fb950" filter="url(#glow)">
    <circle r="3.5"><animateMotion path="M120,150 L196,90" dur="2s" begin="0s"    repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion path="M124,155 L200,95" dur="2s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2s" begin="-0.7s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion path="M116,146 L192,86" dur="2s" begin="-1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle r="3.5" opacity="0">
      <animateMotion path="M322,63 L392,63" dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.62;0.78;1"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.76;0.79;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HTML(파랑) -->
  <g fill="#2f81f7" filter="url(#glow)">
    <circle r="4"><animateMotion path="M132,180 L250,180 M314,180 L400,113" dur="4.5s" begin="0s"    repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M132,183 L250,183 M314,180 L400,183" dur="4.5s" begin="-1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M132,177 L250,177 M314,180 L400,253" dur="4.5s" begin="-3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-3.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 캐시 조회(보라) -->
  <g fill="#a371f7" filter="url(#glow)">
    <circle r="3"><animateMotion path="M506,113 L613,135 L506,113" dur="3.2s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M506,183 L611,153 L506,183" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M506,253 L613,172 L506,253" dur="3.2s" begin="-2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 캐시 미스(회색) -->
  <circle r="3" fill="#7d8590" opacity="0" filter="url(#glow)">
    <animateMotion path="M506,264 L610,300" dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.75;1"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.55;0.57;0.73;0.76;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 웹훅(주황) -->
  <circle r="4.5" fill="#f78166" opacity="0" filter="url(#glow2)">
    <animateMotion path="M170,290 L282,290 L282,208 M314,180 L400,183 M506,183 L611,153" dur="8s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;0.5;0.5;0.69;0.69;1;1" keyTimes="0;0.55;0.66;0.665;0.73;0.735;0.80;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.79;0.81;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="440" y="296" text-anchor="middle" fill="#f78166" font-size="10.5" font-weight="700" opacity="0">
    LB 탓에 한 대에만 도달
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.78;0.81;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- ===================== 범례 ===================== -->
  <g font-size="10.5" fill="#6e7681">
    <circle cx="24"  cy="347" r="3.5" fill="#2f81f7"/><text x="34"  y="351">HTML·데이터</text>
    <circle cx="120" cy="347" r="3.5" fill="#3fb950"/><text x="130" y="351">이미지·정적 (엣지 종결)</text>
    <circle cx="270" cy="347" r="3.5" fill="#a371f7"/><text x="280" y="351">캐시 조회</text>
    <circle cx="350" cy="347" r="3.5" fill="#f78166"/><text x="360" y="351">무효화 웹훅 · 8초마다</text>
    <circle cx="495" cy="347" r="3.5" fill="#7d8590"/><text x="505" y="351">캐시 미스 → 원본</text>
  </g>
</svg>
