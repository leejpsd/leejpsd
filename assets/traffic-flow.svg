<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif">
  <defs>
    <filter id="pglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pglow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- ===== 캔버스 ===== -->
  <rect x="3" y="3" width="894" height="394" rx="18" fill="#0B0F19" stroke="#F0F6FC" stroke-opacity="0.10"/>
  <ellipse cx="200" cy="200" rx="200" ry="130" fill="#58A6FF" opacity="0.05" filter="url(#soft)"/>
  <ellipse cx="680" cy="190" rx="160" ry="120" fill="#BC8CFF" opacity="0.06" filter="url(#soft)"/>

  <!-- ===== 에디토리얼 라벨 · 범례 ===== -->
  <text x="36" y="36" fill="#8B949E" font-size="10" letter-spacing="3" font-weight="600">발매 트래픽 플로우 · 8초 루프</text>
  <g font-size="9.5" fill="#8B949E">
    <circle cx="556" cy="32" r="3" fill="#58A6FF"/><text x="565" y="35.5">HTML·데이터</text>
    <circle cx="650" cy="32" r="3" fill="#3FB950"/><text x="659" y="35.5">이미지·정적</text>
    <circle cx="738" cy="32" r="3" fill="#BC8CFF"/><text x="747" y="35.5">캐시 조회</text>
    <circle cx="812" cy="32" r="3" fill="#F0883E"/><text x="821" y="35.5">무효화</text>
  </g>

  <!-- ===== 흐름선 (뉴트럴, 입자가 색을 나름) ===== -->
  <g fill="none" stroke="#F0F6FC" stroke-opacity="0.08" stroke-width="1.2">
    <path d="M140,162 Q190,118 240,88"/>
    <path d="M368,78 L430,78"/>
    <path d="M168,190 L250,190"/>
    <path d="M322,190 Q362,190 404,152"/>
    <path d="M322,190 L404,208"/>
    <path d="M322,190 Q362,236 404,264"/>
    <path d="M548,152 Q586,162 620,174"/>
    <path d="M548,208 L620,192"/>
    <path d="M548,264 Q586,240 620,210"/>
    <path d="M548,278 Q590,302 620,318"/>
    <path d="M190,326 L266,326 Q286,326 286,306 L286,222"/>
  </g>

  <!-- ===== 노드 (무채색) ===== -->
  <!-- 사용자 -->
  <rect x="40" y="158" width="128" height="64" rx="13" fill="#F0F6FC" fill-opacity="0.03" stroke="#F0F6FC" stroke-opacity="0.14" stroke-width="1.2"/>
  <text x="104" y="186" text-anchor="middle" fill="#E6EDF3" font-size="12.5" font-weight="700">사용자</text>
  <text x="104" y="203" text-anchor="middle" fill="#8B949E" font-size="9.5">동시접속 30,000</text>

  <!-- CloudFront -->
  <rect x="240" y="52" width="128" height="56" rx="13" fill="#F0F6FC" fill-opacity="0.03" stroke="#F0F6FC" stroke-opacity="0.14" stroke-width="1.2"/>
  <text x="304" y="76" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">CloudFront</text>
  <text x="304" y="92" text-anchor="middle" fill="#8B949E" font-size="9.5">이미지·정적 엣지 종결</text>

  <!-- S3 -->
  <rect x="430" y="56" width="86" height="48" rx="12" fill="none" stroke="#F0F6FC" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="473" y="77" text-anchor="middle" fill="#8B949E" font-size="11" font-weight="600">S3</text>
  <text x="473" y="92" text-anchor="middle" fill="#6E7681" font-size="9">이미지 원본 · 미스만</text>

  <!-- ALB -->
  <rect x="250" y="158" width="72" height="64" rx="13" fill="#F0F6FC" fill-opacity="0.03" stroke="#F0F6FC" stroke-opacity="0.14" stroke-width="1.2"/>
  <text x="286" y="194" text-anchor="middle" fill="#E6EDF3" font-size="12.5" font-weight="700">ALB</text>

  <!-- Next.js 클러스터 -->
  <rect x="392" y="104" width="168" height="196" rx="15" fill="#F0F6FC" fill-opacity="0.02" stroke="#F0F6FC" stroke-opacity="0.12" stroke-width="1.2"/>
  <text x="408" y="127" fill="#E6EDF3" font-size="11.5" font-weight="700">Next.js</text>
  <text x="544" y="127" text-anchor="end" fill="#6E7681" font-size="9">렌더링 서버</text>
  <g>
    <rect x="404" y="138" width="144" height="34" rx="9" fill="#F0F6FC" fill-opacity="0.03" stroke="#F0F6FC" stroke-opacity="0.13" stroke-width="1">
      <animate attributeName="stroke" values="#F0F6FC;#F0F6FC;#F0883E;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.13;0.13;0.9;0.13" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="404" y="194" width="144" height="34" rx="9" fill="#F0F6FC" fill-opacity="0.03" stroke="#F0F6FC" stroke-opacity="0.13" stroke-width="1">
      <animate attributeName="stroke" values="#F0F6FC;#F0F6FC;#F0883E;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.13;0.13;0.9;0.13" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="404" y="250" width="144" height="34" rx="9" fill="#F0F6FC" fill-opacity="0.03" stroke="#F0F6FC" stroke-opacity="0.13" stroke-width="1">
      <animate attributeName="stroke" values="#F0F6FC;#F0F6FC;#F0883E;#F0F6FC" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.13;0.13;0.9;0.13" keyTimes="0;0.80;0.84;0.95" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="476" y="159" text-anchor="middle" fill="#8B949E" font-size="10" font-weight="600">instance</text>
    <text x="476" y="215" text-anchor="middle" fill="#8B949E" font-size="10" font-weight="600">instance</text>
    <text x="476" y="271" text-anchor="middle" fill="#8B949E" font-size="10" font-weight="600">instance</text>
    <circle cx="530" cy="155" r="2" fill="#3FB950"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="211" r="2" fill="#3FB950"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-0.7s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="267" r="2" fill="#3FB950"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Redis -->
  <rect x="620" y="150" width="100" height="84" rx="15" fill="#BC8CFF" fill-opacity="0.05" stroke="#BC8CFF" stroke-opacity="0.45" stroke-width="1.2"/>
  <ellipse cx="670" cy="172" rx="16" ry="5" fill="none" stroke="#BC8CFF" stroke-opacity="0.8" stroke-width="1.2"/>
  <path d="M654,172 v10 a16,5 0 0,0 32,0 v-10" fill="none" stroke="#BC8CFF" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="670" y="207" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">Redis</text>
  <text x="670" y="222" text-anchor="middle" fill="#8B949E" font-size="9">FETCH·PAGE 캐시 공유</text>
  <!-- 무효화 파문 -->
  <circle cx="670" cy="192" r="10" fill="none" stroke="#F0883E" stroke-width="1.8" opacity="0" filter="url(#pglow2)">
    <animate attributeName="r"       values="10;10;10;56;10" keyTimes="0;0;0.80;0.92;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0"    keyTimes="0;0;0.80;0.92;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="670" cy="192" r="10" fill="none" stroke="#F0883E" stroke-width="1" opacity="0">
    <animate attributeName="r"       values="10;10;10;74;10" keyTimes="0;0;0.82;0.96;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.45;0;0"   keyTimes="0;0;0.82;0.96;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 백엔드 -->
  <rect x="620" y="304" width="100" height="48" rx="12" fill="none" stroke="#F0F6FC" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="670" y="325" text-anchor="middle" fill="#8B949E" font-size="10.5" font-weight="600">백엔드 API</text>
  <text x="670" y="340" text-anchor="middle" fill="#6E7681" font-size="9">캐시 미스만</text>

  <!-- 웹훅 -->
  <rect x="40" y="304" width="150" height="48" rx="12" fill="#F0883E" fill-opacity="0.05" stroke="#F0883E" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="115" y="324" text-anchor="middle" fill="#F0883E" font-size="11" font-weight="700">백엔드 Webhook</text>
  <text x="115" y="340" text-anchor="middle" fill="#8B949E" font-size="9">어드민 수정 시</text>

  <!-- ===== 입자 ===== -->
  <!-- 이미지(초록) -->
  <g fill="#3FB950" filter="url(#pglow)">
    <circle r="3"><animateMotion path="M140,162 Q190,118 240,88" dur="2.2s" begin="0s"     repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M140,166 Q192,124 242,92" dur="2.2s" begin="-0.73s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2.2s" begin="-0.73s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M140,158 Q188,112 238,84" dur="2.2s" begin="-1.46s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="2.2s" begin="-1.46s" repeatCount="indefinite"/></circle>
    <circle r="3" opacity="0">
      <animateMotion path="M368,78 L430,78" dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.62;0.78;1"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.76;0.79;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HTML(파랑) -->
  <g fill="#58A6FF" filter="url(#pglow)">
    <circle r="3.4"><animateMotion path="M168,190 L250,190 M322,190 Q362,190 404,152" dur="4.5s" begin="0s"    repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="3.4"><animateMotion path="M168,193 L250,193 M322,190 L404,208"          dur="4.5s" begin="-1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle r="3.4"><animateMotion path="M168,187 L250,187 M322,190 Q362,236 404,264"  dur="4.5s" begin="-3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1" keyTimes="0;0.42;0.5;1"/><animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.40;0.44;0.52;0.9;1" dur="4.5s" begin="-3.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 캐시 조회(보라) -->
  <g fill="#BC8CFF" filter="url(#pglow)">
    <circle r="2.6"><animateMotion path="M548,152 Q586,162 620,174 Q586,162 548,152" dur="3.2s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion path="M548,208 L620,192 L548,208"                 dur="3.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion path="M548,264 Q586,240 620,210 Q586,240 548,264" dur="3.2s" begin="-2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 캐시 미스(회색) -->
  <circle r="2.6" fill="#8B949E" opacity="0" filter="url(#pglow)">
    <animateMotion path="M548,278 Q590,302 620,318" dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.75;1"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.55;0.57;0.73;0.76;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 웹훅(주황) -->
  <circle r="4" fill="#F0883E" opacity="0" filter="url(#pglow2)">
    <animateMotion path="M190,326 L266,326 Q286,326 286,306 L286,222 M322,190 L404,208 M548,208 L620,192" dur="8s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;0.55;0.55;0.79;0.79;1;1" keyTimes="0;0.55;0.66;0.665;0.73;0.735;0.80;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.79;0.81;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== 이벤트 필 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.78;0.81;1" dur="8s" repeatCount="indefinite"/>
    <rect x="296" y="240" width="132" height="22" rx="11" fill="#0B0F19" stroke="#F0883E" stroke-opacity="0.7" stroke-width="1"/>
    <text x="362" y="255" text-anchor="middle" fill="#F0883E" font-size="9.5" font-weight="600">LB 탓에 한 대에만 도달</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.84;0.94;1" dur="8s" repeatCount="indefinite"/>
    <rect x="590" y="252" width="160" height="24" rx="12" fill="#0B0F19" stroke="#F0883E" stroke-opacity="0.85" stroke-width="1.2"/>
    <text x="670" y="268" text-anchor="middle" fill="#F0883E" font-size="10" font-weight="700">전역 무효화 · 6대 동시 반영</text>
  </g>
</svg>
